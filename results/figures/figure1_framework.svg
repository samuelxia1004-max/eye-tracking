   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0072b2" x="22.275886" y="52.832135" transform="rotate(-0 22.275886 52.832135)">BBBD benchmark</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(22.275886 68.011094)">52 participants; 251 paired videos</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(22.275886 76.2372)">attentive first / distracted rewatch</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(22.275886 83.755094)">X, Y and pupil ISC</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(22.275886 92.222876)">label-free within-session reference</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #009e73" x="157.288819" y="52.832135" transform="rotate(-0 157.288819 52.832135)">Freeze and transport</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(157.288819 68.011094)">participant + video holdout</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(157.288819 75.883094)">freeze features, scaling and C</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(157.288819 83.755094)">validation gate before Sherlock</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(157.288819 91.627094)">no Sherlock-outcome tuning</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #e69f00" x="291.966732" y="52.832135" transform="rotate(-0 291.966732 52.832135)">Sherlock application</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(291.966732 68.011094)">104 participants; 4 groups</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(291.966732 76.478876)">18 usable annotated boundaries</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(291.966732 83.755094)">global and boundary contrasts</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(291.966732 92.222876)">cohort-relative ocular score</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d55e00" x="30.651378" y="178.55434" transform="rotate(-0 30.651378 178.55434)">Null 1: participant labels</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(30.651378 194.32908)">Hold annotated boundaries fixed</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(30.651378 201.605299)">shuffle labels at fixed group sizes</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(30.651378 209.477299)">tests group exchangeability</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(30.651378 217.94508)">at the annotated contrast</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #cc79a7" x="260.139862" y="178.55434" transform="rotate(-0 260.139862 178.55434)">Null 2: boundary locations</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(260.139862 193.733299)">Hold participant groups fixed</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(260.139862 201.605299)">circularly shift the boundary set</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(260.139862 209.477299)">tests whether the group contrast</text>
    <text style="font-size: 6.15px; font-family: 'DejaVu Sans'" transform="translate(260.139862 217.349299)">is location-specific</text>
   </g>
